org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Force AGP to use the modern cmdline-tools sdkmanager (v20 = XML v4 capable)
# instead of its bundled shim (XML v3 only). The shim silently hangs when it
# encounters v4 package metadata on disk.
android.sdkmanager.tool.path=/Users/ban/Library/Android/sdk/cmdline-tools/latest/bin/sdkmanager
