name: medbuddy
description: "MedBuddy - Medication adherence app with on-device AI verification and accessibility lock."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter

  # Backend
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0

  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # UI / typography
  google_fonts: ^8.1.0
  intl: ^0.19.0
  responsive_framework: ^1.4.0

  # Camera + on-device AI (Phase 2)
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.13.2
  # 0.12 for IsolateInterpreter — inference must not run on the UI isolate.
  tflite_flutter: ^0.12.0
  image: ^4.2.0

  # Notifications. Daily repeats are re-armed by the plugin's own boot
  # receiver; the lock is armed by native AlarmManager (android/.../Lock*.kt).
  # No background-worker package is involved — see NotificationService.
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4
  permission_handler: ^12.0.1

  # Local preferences (theme, lock mode)
  shared_preferences: ^2.3.2

  # NOTE: the Phase 3 lock is native Kotlin behind the `medbuddy/lock`
  # MethodChannel. Do not add flutter_accessibility_service or
  # flutter_overlay_window back — they were never wired to anything.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/models/
