name: medbuddy
description: "MedBuddy - Medication adherence app with on-device AI verification and accessibility lock."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Backend
  supabase_flutter: ^2.5.6
  flutter_dotenv: ^5.1.0

  # State + routing
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.7

  # UI / typography
  google_fonts: ^6.2.1
  intl: ^0.19.0
  flutter_adaptive_scaffold: ^0.2.0
  responsive_framework: ^1.4.0
  fl_chart: ^0.68.0

  # Camera + on-device AI (Phase 2)
  camera: ^0.11.0
  google_mlkit_face_detection: ^0.10.0
  tflite_flutter: ^0.11.0
  image: ^4.2.0
  path_provider: ^2.1.4

  # Notifications + background scheduling
  flutter_local_notifications: ^17.2.2
  workmanager: ^0.9.0+3
  timezone: ^0.9.4
  permission_handler: ^11.3.1

  # Lock / overlay (Phase 3)
  flutter_accessibility_service: ^0.3.0
  flutter_overlay_window: ^0.4.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  fake_async: ^1.3.1

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/models/
