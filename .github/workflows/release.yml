name: Release (Android + iOS)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. v0.9.0-alpha). Used as the GitHub Release name.'
        required: true

env:
  FLUTTER_VERSION: '3.41.6'
  JAVA_VERSION: '17'

permissions:
  contents: write

jobs:
  android-release:
    name: Build APK + AAB
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache pub-cache
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Stub .env (gitignored, required as bundled asset)
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - run: flutter pub get

      - name: Build APK (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build App Bundle
        run: flutter build appbundle --release

      - name: Collect artifacts
        id: artifacts
        run: |
          mkdir -p release-out
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
             release-out/medbuddy-${{ steps.tag.outputs.name }}-arm64-v8a.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk \
             release-out/medbuddy-${{ steps.tag.outputs.name }}-armeabi-v7a.apk
          cp build/app/outputs/flutter-apk/app-x86_64-release.apk \
             release-out/medbuddy-${{ steps.tag.outputs.name }}-x86_64.apk
          cp build/app/outputs/bundle/release/app-release.aab \
             release-out/medbuddy-${{ steps.tag.outputs.name }}.aab
          ls -lh release-out/

      - name: Upload build artifacts (workflow run)
        uses: actions/upload-artifact@v7
        with:
          name: android-${{ steps.tag.outputs.name }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 30

  ios-release:
    name: Build unsigned iOS .ipa
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6

      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache pub-cache
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - name: Cache CocoaPods
        uses: actions/cache@v5
        with:
          path: ios/Pods
          key: pods-${{ runner.os }}-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            pods-${{ runner.os }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Stub .env (gitignored, required as bundled asset)
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - run: flutter pub get

      - name: Pod install
        working-directory: ios
        run: pod install --repo-update

      - name: Build iOS (no codesign)
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA
        id: ipa
        run: |
          mkdir -p release-out Payload
          cp -r build/ios/iphoneos/Runner.app Payload/
          IPA="release-out/medbuddy-${{ steps.tag.outputs.name }}-unsigned.ipa"
          zip -qr "$IPA" Payload
          ls -lh "$IPA"

      - name: Upload IPA (workflow run)
        uses: actions/upload-artifact@v7
        with:
          name: ios-${{ steps.tag.outputs.name }}
          path: release-out/*
          if-no-files-found: error
          retention-days: 30

  publish-release:
    name: Publish GitHub Release
    needs: [android-release, ios-release]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "name=${{ github.event.inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          fi

      - name: Download Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: android-${{ steps.tag.outputs.name }}
          path: release-out

      - name: Download iOS artifacts
        uses: actions/download-artifact@v8
        with:
          name: ios-${{ steps.tag.outputs.name }}
          path: release-out

      - name: List artifacts
        run: ls -lh release-out/

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          name: ${{ steps.tag.outputs.name }}
          generate_release_notes: true
          prerelease: ${{ contains(steps.tag.outputs.name, '-alpha') || contains(steps.tag.outputs.name, '-beta') || contains(steps.tag.outputs.name, '-rc') }}
          files: release-out/*
          fail_on_unmatched_files: true
