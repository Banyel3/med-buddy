name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same branch when a new push lands.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.41.6'
  JAVA_VERSION: '17'
  NODE_VERSION: '20'
  DENO_VERSION: 'v1.46.3'

jobs:
  # ---------------- Path filter ----------------
  # Decide which jobs to run based on what changed. Saves CI minutes on
  # PRs that only touch one surface.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      flutter: ${{ steps.filter.outputs.flutter }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      edge: ${{ steps.filter.outputs.edge }}
    steps:
      - uses: actions/checkout@v6
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            flutter:
              - 'lib/**'
              - 'test/**'
              - 'android/**'
              - 'ios/**'
              - 'pubspec.yaml'
              - 'pubspec.lock'
              - 'analysis_options.yaml'
              - '.github/workflows/ci.yml'
            dashboard:
              - 'nextjs-dashboard/**'
              - '.github/workflows/ci.yml'
            edge:
              - 'supabase/functions/**'
              - '.github/workflows/ci.yml'

  # ---------------- Flutter ----------------
  flutter:
    name: Flutter — format + analyze + test
    needs: changes
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: Cache pub-cache
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}
          restore-keys: |
            pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter --version
      - run: flutter pub get

      - name: Stub .env (gitignored, required as bundled asset)
        run: |
          if [ ! -f .env ]; then cp .env.example .env; fi

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze --fatal-infos

      - name: Tests with coverage
        run: flutter test --coverage --no-pub --reporter=expanded

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: flutter-coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

      - name: Pub outdated (informational, never fails)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: flutter pub outdated --no-dev-dependencies --mode=outdated

  # ---------------- Flutter Android build smoke ----------------
  flutter-build:
    name: Flutter — Android debug APK
    needs: flutter
    if: needs.changes.outputs.flutter == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - name: Cache Gradle
        uses: actions/cache@v5
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android/**/*.gradle*', 'android/**/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Cache pub-cache
        uses: actions/cache@v5
        with:
          path: ~/.pub-cache
          key: pub-${{ runner.os }}-${{ env.FLUTTER_VERSION }}-${{ hashFiles('pubspec.lock') }}

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Stub .env (CI has no real Supabase keys)
        run: |
          echo "SUPABASE_URL=https://placeholder.supabase.co" > .env
          echo "SUPABASE_ANON_KEY=placeholder" >> .env

      - name: Stub tflite model if missing
        run: |
          mkdir -p assets/models
          if [ ! -f assets/models/pills_detection.tflite ]; then
            head -c 1024 /dev/urandom > assets/models/pills_detection.tflite
          fi

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: APK size
        if: always()
        run: ls -lh build/app/outputs/flutter-apk/app-debug.apk || true

  # ---------------- Dashboard ----------------
  dashboard:
    name: Dashboard — tsc + lint + test + build
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nextjs-dashboard
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: nextjs-dashboard/package-lock.json

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: nextjs-dashboard/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('nextjs-dashboard/package-lock.json') }}-${{ hashFiles('nextjs-dashboard/**/*.[jt]s', 'nextjs-dashboard/**/*.[jt]sx') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('nextjs-dashboard/package-lock.json') }}-

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint --if-present

      - name: Tests
        run: npm test

      - name: Build smoke
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          SUPABASE_SERVICE_ROLE_KEY: placeholder

  # ---------------- Supabase Edge Functions ----------------
  edge-functions:
    name: Edge Functions — deno fmt + lint + test
    needs: changes
    if: needs.changes.outputs.edge == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    defaults:
      run:
        working-directory: supabase
    steps:
      - uses: actions/checkout@v6
      - uses: denoland/setup-deno@v2
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - name: Deno format check
        run: deno fmt --check functions/

      - name: Deno lint
        run: deno lint functions/

      - name: Deno test
        run: deno test --quiet --allow-env --allow-net functions/_tests/

  # ---------------- All-green gate ----------------
  # Use this as the required status check in branch protection. Stays
  # green when irrelevant jobs were skipped via path filters.
  ci-status:
    name: CI status
    if: always()
    needs:
      - changes
      - flutter
      - flutter-build
      - dashboard
      - edge-functions
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any required job failed
        run: |
          set -e
          for r in \
            "${{ needs.flutter.result }}" \
            "${{ needs.flutter-build.result }}" \
            "${{ needs.dashboard.result }}" \
            "${{ needs.edge-functions.result }}"; do
            case "$r" in
              success|skipped|"") ;;
              *) echo "Job failed with result=$r" && exit 1 ;;
            esac
          done
          echo "All required jobs passed (or were skipped via path filter)."
