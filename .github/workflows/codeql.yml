name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly run so new GitHub-published rules catch existing code.
    - cron: '17 4 * * 1'

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # Dart isn't supported by CodeQL. JavaScript covers .ts + .tsx.
        language: [javascript]
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          # security-extended adds query packs beyond the default.
          queries: security-extended

      - uses: github/codeql-action/analyze@v4
        with:
          category: '/language:${{ matrix.language }}'
